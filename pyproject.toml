[project]
name = "ai-tech-lead"
version = "0.1.0"
description = "Local AI Technical Lead Assistant"
requires-python = ">=3.13,<3.14"

dependencies = [
  "langgraph",
  "langchain-core",
]

[project.scripts]
ai-tech-lead = "ai_tech_lead.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.27",
]
