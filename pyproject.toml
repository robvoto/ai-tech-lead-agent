[project]
name = "ai-tech-lead"
version = "0.1.0"
description = "Local AI Technical Lead Assistant"
requires-python = ">=3.13,<3.14"

dependencies = [
  "langgraph",
  "langchain-core",
  "langchain-openai",
  "gspread>=6.1.0",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "langmem>=0.0.30",
]

[project.scripts]
ai-tech-lead = "ai_tech_lead.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.27",
    "ruff>=0.9.0,<1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
